# NOSTROMO — Omarchy 2.x/3.x Hyprland overrides (legacy).
#
# Omarchy 4 uses hyprland.lua instead; this file is ignored there.
# Only overrides live here: Omarchy sources/includes the theme's file into its
# own config, so do not paste a whole Hyprland configuration.

general {
    col.active_border   = rgba(7dff8aee)
    col.inactive_border = rgba(2f7a3aee)

    gaps_in     = 4
    gaps_out    = 8
    border_size = 2
}

group {
    col.border_active   = rgba(7dff8aee)
    col.border_inactive = rgba(2f7a3aee)

    groupbar {
        col.active          = rgba(7dff8a2e)
        col.inactive        = rgba(2f7a3a1f)
        text_color          = rgb(5fd16b)
        text_color_inactive = rgb(2f7a3a)
        font_family         = monospace
        font_size           = 11
        height              = 22
    }
}

decoration {
    rounding         = 0
    active_opacity   = 1.0
    inactive_opacity = 1.0
    dim_inactive     = false

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}
