# NOSTROMO — Omarchy 2.x/3.x hyprlock colors (legacy).
#
# Omarchy sources this file from its own hyprlock configuration, which owns the
# layout (background, clock, input field). Defining blocks here would duplicate
# that layout, so this file only supplies colors.
#
# Omarchy 4 uses its QML lock screen instead; see [lock] in shell.toml.

$color             = rgba(10, 12, 9, 1)
$inner_color       = rgba(10, 12, 9, 1)
$outer_color       = rgba(125, 255, 138, 1)
$font_color        = rgba(95, 209, 107, 1)
$placeholder_color = rgba(67, 153, 79, 1)
$check_color       = rgba(255, 176, 0, 1)
