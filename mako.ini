# NOSTROMO — Omarchy 2.x/3.x Mako notifications (legacy).
#
# Omarchy 4 uses its QML notifications instead; this file is ignored there.
# Self-contained (it does not include Omarchy's core.ini) so the palette and
# urgency treatment survive on older installs.

text-color=#5fd16b
border-color=#7dff8a
background-color=#0a0c09
width=420
height=110
padding=10
border-size=2
border-radius=0
font=BlexMono Nerd Font Mono 10
anchor=top-right
outer-margin=20
default-timeout=5000
max-icon-size=32

# Low: quiet, dim green. Normal: phosphor accent. Critical: error orange.
[urgency=low]
border-color=#2f7a3a
text-color=#43994f

[urgency=normal]
border-color=#7dff8a
text-color=#5fd16b

[urgency=critical]
border-color=#ff5f1f
text-color=#ff5f1f
default-timeout=0

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false
